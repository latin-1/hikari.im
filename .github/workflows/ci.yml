name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true
      - run: yarn
      - run: yarn check
      - run: yarn typecheck
      - run: yarn build
