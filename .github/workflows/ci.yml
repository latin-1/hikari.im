name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.4.0
      - uses: moonrepo/setup-toolchain@v0.6.4
        with:
          auto-install: true

      - run: yarn
      - run: yarn constraints
      - run: yarn dedupe --check

      - run: yarn check
      - run: yarn build
